name: Build DonyayeYasin APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Android project from source archive
        run: |
          mkdir -p /tmp/yasin-src
          unzip -q source/YasinLand-Android-Final-Source.zip -d /tmp/yasin-src
          cp -a /tmp/yasin-src/yasinland-apk/. .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DonyayeYasin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
